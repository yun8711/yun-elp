# 构建并部署 VitePress 文档站点到 GitHub Pages
#
# 前置条件：
#   1. 在 GitHub 仓库 Settings → Pages 中，将 Source 选为 "GitHub Actions"
#   2. 在 Settings → Pages 中创建一个名为 `github-pages` 的 deployment environment
#      并允许来自默认分支的 workflow 向它部署
#   3. 确保仓库名是 `yun-elp`（base 路径 `/yun-elp/` 与之对应）
#      否则修改 docs/.vitepress/config/index.ts 中的 `base` 配置

name: Deploy Docs to GitHub Pages

on:
  # 默认分支（main）推送时，仅 docs/ 或本配置文件变化时触发
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/generate-ai-docs.ts'
      - 'package.json'
      - 'docs/package.json'
      - '.github/workflows/docs-deploy.yml'

  # 允许手动触发
  workflow_dispatch:

# 设置 GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务在运行
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 勿用 latest：pnpm 11+ 需 Node >= 22.13，与 lockfile v9 及本地环境对齐
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm build:docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # 部署到 GitHub Pages 环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
